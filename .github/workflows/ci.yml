name: Verify inventory region handoff

on:
  workflow_dispatch:
  push:
    branches: [ci/verify-inventory-region-cap]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.runner }} on 9f3e44193
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9f3e44193c2ae34f49cf698052248ca535de8d02
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "9f3e44193c2ae34f49cf698052248ca535de8d02"
          test "$(git rev-parse 'HEAD^{tree}')" = "c37cf4dad73058a1e01fbb6ca3b5899c7e218442"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Install the pinned Rust version
        run: rustup toolchain install --profile minimal --no-self-update --component clippy,rustfmt
      - name: Format
        if: runner.os == 'Windows'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings
      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings -A dead-code
      - name: Full workspace tests
        if: runner.os == 'Windows'
        run: cargo test --profile ci --workspace --locked
