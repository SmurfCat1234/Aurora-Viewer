name: Music preview QA

on:
  push:
    branches:
      - qa/chat-music-previews

permissions:
  contents: read

concurrency:
  group: music-preview-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Check formatting
        if: runner.os == 'Windows'
        run: cargo fmt --all -- --check
      - name: Run the complete workspace
        run: cargo test --profile ci --workspace --locked --no-fail-fast
